<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noted</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
mermaid.initialize({
  startOnLoad: false,
  theme: 'dark',
  securityLevel: 'loose',
  maxTextSize: 100000,
  useMaxWidth: true,
  themeVariables: {
    primaryColor: '#2e2e2e',
    primaryTextColor: '#e8e6e1',
    primaryBorderColor: '#c8a96e',
    lineColor: '#7eb8a4',
    secondaryColor: '#1a1a1a',
    tertiaryColor: '#242424',
    clusterBkg: '#1a1a1a',
    clusterBorder: '#2e2e2e',
    nodeBorder: '#c8a96e',
    nodeTextColor: '#e8e6e1',
    edgeLabelBackground: '#1a1a1a',
    mainBkg: '#1a1a1a',
    altBackground: '#242424',
    titleColor: '#c8a96e',
    actorBkg: '#1a1a1a',
    actorBorder: '#c8a96e',
    actorTextColor: '#e8e6e1',
    signalColor: '#7eb8a4',
    signalTextColor: '#e8e6e1',
    labelBoxBkgColor: '#242424',
    labelBoxBorderColor: '#2e2e2e',
    labelTextColor: '#e8e6e1',
    loopTextColor: '#e8e6e1',
    noteBkgColor: '#242424',
    noteBorderColor: '#2e2e2e',
    classText: '#e8e6e1',
    classBkg: '#1a1a1a',
    classBorder: '#c8a96e',
    classArrow: '#7eb8a4',
  }
});
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --text: #e8e6e1;
    --muted: #888;
    --accent: #c8a96e;
    --accent2: #7eb8a4;
    --danger: #c46a5a;
    --font-mono: 'Courier New', monospace;
    --font-serif: Georgia, serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .logo {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 0.1em;
    color: var(--accent);
  }

  .logo span { color: var(--muted); font-size: 11px; font-weight: normal; margin-left: 8px; letter-spacing: 0; }

  .header-actions { display: flex; gap: 8px; align-items: center; }

  button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }

  button:hover { background: var(--surface2); border-color: var(--muted); }
  button.accent { border-color: var(--accent); color: var(--accent); }
  button.accent:hover { background: rgba(200, 169, 110, 0.1); }
  button.danger { border-color: var(--danger); color: var(--danger); }
  button.danger:hover { background: rgba(196, 106, 90, 0.1); }
  button.recording { border-color: var(--danger); color: var(--danger); animation: pulse 1.2s infinite; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .sidebar {
    width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .notes-list { flex: 1; overflow-y: auto; }

  .note-item {
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  .note-item:hover { background: var(--surface2); }
  .note-item.active { background: var(--surface2); border-left: 2px solid var(--accent); padding-left: 14px; }

  .note-title {
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }

  .note-date { font-size: 10px; color: var(--muted); }

  .editor-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .editor-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .toolbar-group {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .toolbar-sep {
    width: 1px;
    height: 20px;
    background: var(--border);
    margin: 0 4px;
  }

  .tb-btn {
    padding: 4px 8px;
    font-size: 11px;
    border-color: transparent;
    color: var(--muted);
  }

  .tb-btn:hover { color: var(--text); border-color: var(--border); }

  .view-toggle {
    margin-left: auto;
    display: flex;
    gap: 4px;
  }

  .view-toggle button.active {
    color: var(--accent);
    border-color: var(--accent);
  }

  .panels {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  textarea {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: none;
    outline: none;
    padding: 24px;
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.8;
    resize: none;
    tab-size: 2;
  }

  textarea::placeholder { color: var(--muted); }

  .preview {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    border-left: 1px solid var(--border);
    font-family: var(--font-serif);
    line-height: 1.8;
    font-size: 15px;
  }

  .preview h1, .preview h2, .preview h3 {
    font-family: var(--font-mono);
    color: var(--accent);
    margin: 1.5em 0 0.5em;
    font-weight: bold;
  }

  .preview h1 { font-size: 22px; }
  .preview h2 { font-size: 18px; }
  .preview h3 { font-size: 15px; color: var(--accent2); }
  .preview h4 { font-size: 14px; color: var(--accent2); margin: 1em 0 0.5em; }
  .preview p { margin-bottom: 1em; }
  .preview code { background: var(--surface2); padding: 2px 6px; border-radius: 3px; font-family: var(--font-mono); font-size: 13px; color: var(--accent2); }
  .preview pre { background: var(--surface2); padding: 16px; border-radius: 4px; overflow-x: auto; margin-bottom: 1em; }
  .preview pre code { background: none; padding: 0; color: var(--text); }
  .preview blockquote { border-left: 2px solid var(--accent); padding-left: 16px; color: var(--muted); margin-bottom: 1em; }
  .preview ul, .preview ol { padding-left: 24px; margin-bottom: 1em; }
  .preview li { margin-bottom: 4px; }
  .preview a { color: var(--accent); }
  .preview hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  .preview strong { color: var(--accent); font-weight: bold; }
  .preview em { color: var(--accent2); }
  .preview table { border-collapse: collapse; margin-bottom: 1em; width: 100%; }
  .preview th, .preview td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  .preview th { background: var(--surface2); color: var(--accent); font-family: var(--font-mono); font-size: 12px; }
  .preview td { font-size: 14px; }
  .preview tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

  .preview audio {
    display: block;
    width: 100%;
    margin: 8px 0;
    filter: invert(1) hue-rotate(180deg) brightness(0.8);
  }

  .preview video {
    display: block;
    max-width: 100%;
    margin: 8px 0;
    border-radius: 4px;
  }

  .preview .mermaid {
    margin: 1.5em 0;
    text-align: center;
  }

  .recordings-panel {
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    max-height: 160px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .recordings-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .recording-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }

  .recording-item:last-child { border-bottom: none; }

  .recording-item audio {
    flex: 1;
    height: 28px;
    filter: invert(1) hue-rotate(180deg) brightness(0.8);
  }

  .rec-insert {
    font-size: 10px;
    padding: 4px 8px;
    border-color: var(--accent2);
    color: var(--accent2);
  }

  .rec-insert:hover { background: rgba(126, 184, 164, 0.1); }

  .status-bar {
    padding: 4px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    font-size: 10px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;
    letter-spacing: 0.05em;
  }

  .hidden { display: none !important; }

  #title-input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    width: 100%;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #title-input::placeholder { color: var(--muted); }

  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    line-height: 2;
  }

  .note-item { position: relative; }
  .note-del {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 18px;
    height: 18px;
    padding: 0;
    font-size: 12px;
    line-height: 16px;
    text-align: center;
    border: none;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.15s;
    background: var(--surface2);
    border-radius: 2px;
  }
  .note-item:hover .note-del { opacity: 1; }
  .note-del:hover { color: var(--danger); }

  #search-input {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    outline: none;
    width: 100%;
    border-radius: 2px;
  }
  #search-input::placeholder { color: var(--muted); }

  .import-zone {
    border: 2px dashed var(--border);
    border-radius: 4px;
    padding: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin: 8px 16px;
  }
  .import-zone:hover, .import-zone.dragover {
    border-color: var(--accent);
    background: rgba(200, 169, 110, 0.05);
  }
  .import-zone.dragover { border-color: var(--accent2); background: rgba(126, 184, 164, 0.08); }

  .note-match { background: rgba(200, 169, 110, 0.25); padding: 0 1px; border-radius: 2px; }

  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 4;
  }
  .sidebar-overlay.open { display: block; }
  .menu-btn { display: none; font-size: 16px; padding: 4px 10px; }

  /* Tablet */
  @media (max-width: 1024px) {
    header { padding: 10px 14px; }
    .logo { font-size: 16px; }
    .logo span { display: none; }
    .header-actions { gap: 4px; }
    .header-actions button { padding: 4px 8px; font-size: 11px; }
    .sidebar { width: 200px; }
    .editor-toolbar { padding: 6px 10px; gap: 4px; }
    .tb-btn { padding: 3px 6px; font-size: 10px; }
    .preview { padding: 16px; font-size: 14px; }
    textarea { padding: 16px; font-size: 13px; }
  }

  /* Mobile */
  @media (max-width: 700px) {
    .menu-btn { display: block; }
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 260px;
      height: 100vh;
      z-index: 5;
      transition: left 0.2s ease;
      border-right: 1px solid var(--border);
    }
    .sidebar.open { left: 0; }
    .main { position: relative; }
    .note-del { opacity: 1; }

    header { padding: 8px 10px; }
    .logo { font-size: 15px; }
    .header-actions { gap: 3px; }
    .header-actions button { padding: 3px 7px; font-size: 10px; }
    #rec-btn, #vid-btn { font-size: 9px; padding: 3px 5px; }

    .editor-toolbar { padding: 4px 8px; gap: 3px; }
    .tb-btn { padding: 5px 8px; font-size: 11px; }
    .toolbar-sep { margin: 0 2px; }

    .view-toggle { margin-left: auto; }
    .view-toggle button { padding: 5px 10px; font-size: 11px; min-width: 44px; min-height: 36px; }
    .view-toggle #btn-split { display: none; }

    #title-input { font-size: 14px; padding: 8px 12px; }

    .panels { flex-direction: column; }
    .panels textarea { font-size: 15px; padding: 12px; line-height: 1.6; flex: 1; }
    .preview { font-size: 14px; padding: 12px; line-height: 1.6; flex: 1; border-left: none; border-top: 1px solid var(--border); }
    .panels textarea.hidden { flex: 0; }
    .preview.hidden { flex: 0; }

    #save-status { font-size: 9px; }
    #word-count { font-size: 9px; }

    .import-zone { margin: 6px 10px; padding: 10px; font-size: 11px; }
    .recordings-panel { max-height: 100px; }
    .recording-item audio { min-width: 100px; height: 24px; }
    .recording-item video { height: 36px !important; }
    .rec-insert { font-size: 9px; padding: 3px 6px; }

    .status-bar { padding: 3px 10px; }
  }

  @media print {
    body { background: white; color: #000; }
    header, .sidebar, .editor-toolbar, .status-bar, .recordings-panel,
    #title-input, .view-toggle, .tb-btn, .toolbar-sep, .toolbar-group { display: none !important; }
    .editor-area { overflow: visible; }
    .panels { overflow: visible; display: block; }
    .preview { border: none; padding: 20px 40px; overflow: visible; font-size: 13px; line-height: 1.6; color: #000; }
    .preview h1, .preview h2, .preview h3 { color: #000; }
    .preview code { color: #333; background: #f0f0f0; }
    .preview a { color: #000; text-decoration: underline; }
    .preview th { color: #000; }
    .preview .mermaid-wrapper { page-break-inside: avoid; }
    .preview .mermaid-wrapper svg { max-width: 100%; height: auto; }
    textarea { display: none !important; }
  }
</style>
</head>
<body>

<header>
  <button class="menu-btn" onclick="toggleSidebar()" title="Show notes">â˜°</button>
  <div class="logo">NOTED<span>markdown + voice + diagrams</span></div>
  <div class="header-actions">
    <button class="accent" onclick="newNote()">+ new note</button>
    <button onclick="saveNote()">save</button>
    <button onclick="exportMd()">.md</button>
    <button onclick="exportPdf()">PDF</button>
    <button id="rec-btn" onclick="toggleRecording()">&#9679; record</button>
    <button id="vid-btn" onclick="toggleVideoRecording()">&#9646;&#9646; video</button>
  </div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <span>notes</span>
      <span id="note-count">0</span>
    </div>
    <input id="search-input" type="text" placeholder="search notes..." oninput="onSearch()">
    <div class="import-zone" onclick="document.getElementById('file-input').click()">
      drop .md or click to import
    </div>
    <input id="file-input" type="file" accept=".md,.markdown,.txt" style="display:none" onchange="importFile(this)">
    <div class="notes-list" id="notes-list"></div>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <div class="editor-area" id="editor-area">
    <div class="empty-state" id="empty-state">
      no note selected<br>
      <span style="font-size:11px">create one to get started</span>
    </div>

    <div id="note-editor" class="hidden" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
      <input id="title-input" type="text" placeholder="note title..." oninput="onTitleChange()">

      <div class="editor-toolbar">
        <div class="toolbar-group">
          <button class="tb-btn" onclick="insert('# ', '')">H1</button>
          <button class="tb-btn" onclick="insert('## ', '')">H2</button>
          <button class="tb-btn" onclick="insert('### ', '')">H3</button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
          <button class="tb-btn" onclick="insert('**', '**')"><b>B</b></button>
          <button class="tb-btn" onclick="insert('*', '*')"><i>I</i></button>
          <button class="tb-btn" onclick="insert('`', '`')">code</button>
          <button class="tb-btn" onclick="insert('> ', '')">quote</button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
          <button class="tb-btn" onclick="insert('- ', '')">list</button>
          <button class="tb-btn" onclick="insert('---\n', '')">line</button>
        </div>
        <div class="view-toggle">
          <button id="btn-edit" class="active" onclick="setView('edit')">edit</button>
          <button id="btn-split" onclick="setView('split')">split</button>
          <button id="btn-preview" onclick="setView('preview')">preview</button>
        </div>
      </div>

      <div class="panels" id="panels">
        <textarea id="editor" placeholder="start writing in markdown..." oninput="onEditorChange()"></textarea>
        <div class="preview hidden" id="preview"></div>
      </div>

      <div class="recordings-panel hidden" id="recordings-panel">
        <div class="recordings-label">recordings â€” click insert to embed in note</div>
        <div id="recordings-list"></div>
      </div>

      <div class="status-bar">
        <span id="word-count">0 words</span>
        <span id="save-status">unsaved</span>
      </div>
    </div>
  </div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem('noted_notes') || '[]');
// Remove old demo notes that may linger in localStorage from a previous version
const demoPrefixes = ['Chapter 6 - ', 'Chapter 7 - ', 'Chapter 8 - '];
const oldLen = notes.length;
notes = notes.filter(n => !demoPrefixes.some(p => (n.title || '').startsWith(p)));
if (notes.length !== oldLen) localStorage.setItem('noted_notes', JSON.stringify(notes));
let currentId = null;
let mediaRecorder = null;
let audioChunks = [];
let recordings = [];
let isRecording = false;
let isVideoRecording = false;
let currentView = 'edit';

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// post-process mermaid code blocks after marked renders â€” more reliable than custom renderer

function renderSidebar() {
  const list = document.getElementById('notes-list');
  document.getElementById('note-count').textContent = notes.length;
  if (!notes.length) { list.innerHTML = '<div style="padding:16px;color:var(--muted);font-size:12px;">no notes yet</div>'; return; }
  list.innerHTML = notes.map(n => `
    <div class="note-item ${n.id === currentId ? 'active' : ''}" onclick="loadNote('${n.id}');if(window.innerWidth<=700)closeSidebar()">
      <button class="note-del" onclick="event.stopPropagation();deleteNote('${n.id}')" title="Delete note">x</button>
      <div class="note-title">${n.title || 'untitled'}</div>
      <div class="note-date">${new Date(n.updated).toLocaleDateString()}</div>
    </div>
  `).join('');
}

function newNote() {
  const note = { id: genId(), title: '', content: '', updated: Date.now() };
  notes.unshift(note);
  currentId = note.id;
  saveAll();
  openEditor(note);
  renderSidebar();
  document.getElementById('title-input').focus();
}

function loadNote(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  currentId = id;
  recordings = [];
  recordingTranscripts = {};
  document.getElementById('recordings-list').innerHTML = '';
  document.getElementById('recordings-panel').classList.add('hidden');
  openEditor(note);
  renderSidebar();
}

function openEditor(note) {
  document.getElementById('empty-state').classList.add('hidden');
  const ed = document.getElementById('note-editor');
  ed.classList.remove('hidden');
  ed.style.display = 'flex';
  document.getElementById('title-input').value = note.title || '';
  document.getElementById('editor').value = note.content || '';
  updatePreview();
  updateWordCount();
}

function getCurrentNote() { return notes.find(n => n.id === currentId); }

function onTitleChange() {
  const note = getCurrentNote();
  if (!note) return;
  note.title = document.getElementById('title-input').value;
  note.updated = Date.now();
  saveAll();
  document.getElementById('save-status').textContent = 'auto-saved';
  renderSidebar();
}

function onEditorChange() {
  const note = getCurrentNote();
  if (!note) return;
  note.content = document.getElementById('editor').value;
  note.updated = Date.now();
  saveAll();
  document.getElementById('save-status').textContent = 'auto-saved';
  updatePreview();
  updateWordCount();
}

async function updatePreview() {
  const content = document.getElementById('editor').value;
  const preview = document.getElementById('preview');
  preview.innerHTML = marked.parse(content);

  // Convert marked \`\`\`mermaid code blocks into Mermaid elements
  const diagrams = [];
  preview.querySelectorAll('pre').forEach(pre => {
    const code = pre.querySelector('code.language-mermaid');
    if (code) {
      diagrams.push({ text: code.textContent, placeholder: pre });
    }
  });

  // Render each diagram independently via mermaid.render()
  for (const d of diagrams) {
    const id = 'm-' + Math.random().toString(36).slice(2, 8);
    try {
      d.placeholder.textContent = '[rendering diagram...]';
      const { svg } = await mermaid.render(id, d.text);
      const wrapper = document.createElement('div');
      wrapper.className = 'mermaid-wrapper';
      wrapper.innerHTML = svg;
      d.placeholder.replaceWith(wrapper);
    } catch (err) {
      console.error('Mermaid error for diagram:', err, err?.message);
      d.placeholder.innerHTML = '<pre style="color:#c46a5a;border:1px solid #c46a5a;padding:12px;border-radius:4px;">Diagram error: ' + (err?.message || err) + '</pre>';
    }
  }
}

function updateWordCount() {
  const text = document.getElementById('editor').value;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('word-count').textContent = words + ' word' + (words !== 1 ? 's' : '');
}

function saveNote() {
  saveAll();
  document.getElementById('save-status').textContent = 'saved ' + new Date().toLocaleTimeString();
}

function saveAll() { localStorage.setItem('noted_notes', JSON.stringify(notes)); }

function setView(v) {
  if (v === 'split' && window.innerWidth <= 700) v = 'edit';
  currentView = v;
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  document.getElementById('btn-edit').classList.toggle('active', v === 'edit');
  document.getElementById('btn-split').classList.toggle('active', v === 'split');
  document.getElementById('btn-preview').classList.toggle('active', v === 'preview');
  if (v === 'edit') { editor.classList.remove('hidden'); preview.classList.add('hidden'); }
  else if (v === 'preview') { editor.classList.add('hidden'); preview.classList.remove('hidden'); }
  else { editor.classList.remove('hidden'); preview.classList.remove('hidden'); }
}

function insert(before, after) {
  const ta = document.getElementById('editor');
  const start = ta.selectionStart, end = ta.selectionEnd;
  const selected = ta.value.substring(start, end);
  const replacement = before + selected + after;
  ta.value = ta.value.substring(0, start) + replacement + ta.value.substring(end);
  ta.selectionStart = start + before.length;
  ta.selectionEnd = start + before.length + selected.length;
  ta.focus();
  onEditorChange();
}

async function toggleRecording() {
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      const recId = 'rec_' + (recIdCounter++);
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const url = URL.createObjectURL(blob);
        stopTranscription(recId);
        addRecording(url, 'audio', recId);
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      startTranscription(recId);
      const btn = document.getElementById('rec-btn');
      btn.innerHTML = '&#9632; stop recording';
      btn.classList.add('recording');
    } catch(e) { alert('Microphone access denied. Please allow microphone in browser settings.'); }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    const btn = document.getElementById('rec-btn');
    btn.innerHTML = '&#9679; record';
    btn.classList.remove('recording');
  }
}

async function toggleVideoRecording() {
  if (!isVideoRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {

}

function addRecording(url, type, recId) {
  const idx = recordings.length;
  recordings.push({ url, type, recId });
  const panel = document.getElementById('recordings-panel');
  const list = document.getElementById('recordings-list');
  panel.classList.remove('hidden');
  const item = document.createElement('div');
  item.className = 'recording-item';
  const label = `${type} ${idx + 1} â€” ${new Date().toLocaleTimeString()}`;
  const transcript = recordingTranscripts[recId];
  const hasTranscript = transcript && transcript.trim();
  const info = hasTranscript ? ` <span style="font-size:10px;color:var(--accent2)">[transcribed]</span>` : '';
  if (type === 'audio') {
    item.innerHTML = `<audio controls src="${url}"></audio>${info}<button class="rec-insert" onclick="insertRecording(${idx})">insert &darr;</button>`;
  } else {
    item.innerHTML = `<video controls src="${url}" style="height:60px;border-radius:3px;"></video>${info}<button class="rec-insert" onclick="insertRecording(${idx})">insert &darr;</button>`;
  }
  list.appendChild(item);
}

function insertRecording(idx) {
  const rec = recordings[idx];
  const transcript = recordingTranscripts[rec.recId];
  const hasTranscript = transcript && transcript.trim();
  const tSuffix = hasTranscript ? `\n> ðŸ“ ${transcript}\n` : '';
  const tag = rec.type === 'audio'
    ? `\n<audio controls src="${rec.url}"></audio>\n${tSuffix}`
    : `\n<video controls src="${rec.url}" style="max-width:100%"></video>\n${tSuffix}`;
  const ta = document.getElementById('editor');
  const pos = ta.selectionStart;
  ta.value = ta.value.substring(0, pos) + tag + ta.value.substring(pos);
  ta.selectionStart = ta.selectionEnd = pos + tag.length;
  ta.focus();
  onEditorChange();
}

// Search notes
function onSearch() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const list = document.getElementById('notes-list');
  const items = list.querySelectorAll('.note-item');
  items.forEach(el => {
    const title = el.querySelector('.note-title').textContent.toLowerCase();
    const idx = title.indexOf(q);
    if (!q || idx !== -1) {
      el.style.display = '';
    } else {
      el.style.display = 'none';
    }

}

// Import .md file
function importFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let name = file.name.replace(/\.(md|markdown|txt)$/i, '') || 'imported';
    // Extract title from first H1 if present
    const content = e.target.result;
    const h1 = content.match(/^#\s+(.+)/m);
    if (h1) name = h1[1].trim();
    const note = { id: genId(), title: name, content, updated: Date.now() };
    notes.unshift(note);
    currentId = note.id;
    saveAll();
    openEditor(note);
    renderSidebar();
  };
  reader.readAsText(file);
  input.value = '';
}

// Drag-drop import on import zone and editor
function setupDragDrop() {
  const zone = document.querySelector('.import-zone');
  if (!zone) return;
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.name.match(/\.(md|markdown|txt)$/i)) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        let name = file.name.replace(/\.(md|markdown|txt)$/i, '') || 'imported';
        const content = ev.target.result;
        const h1 = content.match(/^#\s+(.+)/m);
        if (h1) name = h1[1].trim();
        const note = { id: genId(), title: name, content, updated: Date.now() };
        notes.unshift(note);
        currentId = note.id;
        saveAll();
        openEditor(note);
        renderSidebar();
      };
      reader.readAsText(file);
    }
  });
}

// Export as .md file
function exportMd() {
  const note = getCurrentNote();
  if (!note) return;
  const title = note.title || 'untitled';
  const content = note.content || '';
  const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = title.replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-') + '.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Keyboard shortcuts
function setupShortcuts() {
  document.addEventListener('keydown', (e) => {
    const isCtrl = e.ctrlKey || e.metaKey;
    if (!isCtrl) return;
    switch (e.key.toLowerCase()) {
      case 's':
        e.preventDefault();
        saveNote();
        break;
      case 'n':
        e.preventDefault();
        newNote();
        break;
      case 'p':
        e.preventDefault();
        exportPdf();
        break;
      case 'd':
        if (e.shiftKey) {
          e.preventDefault();
          const note = getCurrentNote();
          if (note) deleteNote(note.id);
        }
        break;
    }
  });
}

// Sync scroll: editor scroll position maps to preview
function setupSyncScroll() {
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  if (!editor || !preview) return;
  let syncing = false;
  editor.addEventListener('scroll', () => {
    if (syncing) return;
    syncing = true;
    const pct = editor.scrollTop / (editor.scrollHeight - editor.clientHeight);
    preview.scrollTop = pct * (preview.scrollHeight - preview.clientHeight);
    syncing = false;
  });
}

// Image paste: paste clipboard images as base64 markdown
// Sidebar toggle for mobile
function toggleSidebar() {
  document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}
function closeSidebar() {
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}
function setupImagePaste() {
  const editor = document.getElementById('editor');
  if (!editor) return;
  editor.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const blob = item.getAsFile();
        const reader = new FileReader();
        reader.onload = (ev) => {
          const dataUrl = ev.target.result;
          const ta = document.getElementById('editor');
          const start = ta.selectionStart;
          const imgMd = `\n![pasted image](${dataUrl})\n`;
          ta.value = ta.value.substring(0, start) + imgMd + ta.value.substring(ta.selectionEnd);
          ta.selectionStart = ta.selectionEnd = start + imgMd.length;
          ta.focus();
          onEditorChange();
        };
        reader.readAsDataURL(blob);
        break;
      }
    }
  });
}

// Delete note
function deleteNote(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  if (!confirm('Delete "' + (note.title || 'untitled') + '"?')) return;
  notes = notes.filter(n => n.id !== id);
  if (currentId === id) {
    currentId = notes.length > 0 ? notes[0].id : null;
    if (currentId) { openEditor(notes[0]); } else { closeEditor(); }
  }
  saveAll();
  renderSidebar();
}

function closeEditor() {
  document.getElementById('note-editor').classList.add('hidden');
  document.getElementById('note-editor').style.display = 'none';
  document.getElementById('empty-state').classList.remove('hidden');
  document.getElementById('save-status').textContent = '';
  document.getElementById('word-count').textContent = '';
}

// Export to PDF
async function exportPdf() {
  const note = getCurrentNote();
  if (!note) return;

  const title = note.title || 'untitled';
  const content = document.getElementById('editor').value;

  // Strip media tags from content â€” transcripts (if any) remain as blockquote text
  let printContent = content.replace(/<audio[^>]*><\/audio>\s*/g, '');
  printContent = printContent.replace(/<video[^>]*>[^]*?<\/video>\s*/g, '');
  printContent = printContent.replace(/<video[^>]*\/>\s*/g, '');

  const rendered = marked.parse(printContent);

  // Create a temp container to find and render Mermaid diagrams
  const tmp = document.createElement('div');
  tmp.innerHTML = rendered;

  const diagrams = [];
  tmp.querySelectorAll('pre code.language-mermaid').forEach(el => {
    diagrams.push({ text: el.textContent, placeholder: el.parentElement });
  });

  for (let i = 0; i < diagrams.length; i++) {
    const d = diagrams[i];
    const id = 'pdf-m-' + Date.now() + '-' + i;
    try {
      const { svg } = await mermaid.render(id, d.text);
      const wrapper = document.createElement('div');
      wrapper.className = 'mermaid-wrapper';
      wrapper.innerHTML = svg;
      d.placeholder.replaceWith(wrapper);
    } catch (err) {
      d.placeholder.innerHTML =
        '<div style="padding:12px;border:1px solid #999;border-radius:4px;color:#999;font-style:italic;">[Diagram error: ' + (err.message || 'render failed') + ']</div>';
    }
  }

  const finalHtml = tmp.innerHTML;

  const printWin = window.open('', '_blank', 'width=800,height=600');
  if (!printWin) { alert('Please allow pop-ups for PDF export.'); return; }
  printWin.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8">');
  printWin.document.write('<title>' + title + '</title>');
  printWin.document.write('<style>');
  printWin.document.write('body{background:white;color:#000;font-family:Georgia,serif;padding:0;margin:0}');
  printWin.document.write('.preview{padding:40px;font-size:13px;line-height:1.6;color:#000}');
  printWin.document.write('.preview h1,.preview h2,.preview h3{color:#000;font-family:Georgia,serif}');
  printWin.document.write('.preview code{color:#333;background:#f0f0f0;font-family:"Courier New",monospace;font-size:12px}');
  printWin.document.write('.preview pre{background:#f5f5f5;padding:12px;border-radius:4px;overflow-x:auto}');
  printWin.document.write('.preview a{color:#000;text-decoration:underline}');
  printWin.document.write('.preview th{color:#000;background:#f0f0f0}');
  printWin.document.write('.preview table{border-collapse:collapse;width:100%}');
  printWin.document.write('.preview th,.preview td{border:1px solid #ccc;padding:6px 10px}');
  printWin.document.write('.preview blockquote{border-left:2px solid #999;padding-left:14px;color:#555;margin:1em 0}');
  printWin.document.write('.mermaid-wrapper{page-break-inside:avoid;margin:1.5em 0;text-align:center}');
  printWin.document.write('.mermaid-wrapper svg{max-width:100%;height:auto;overflow:visible}');
  printWin.document.write('.preview p{margin-bottom:0.8em}');
  printWin.document.write('.preview ul,.preview ol{padding-left:24px;margin-bottom:0.8em}');
  printWin.document.write('</style>');
  printWin.document.write('</head><body>');
  printWin.document.write('<h1 style="font-family:Georgia,serif;padding:40px 40px 0 40px;margin:0;font-size:26px;">' + title + '</h1>');
  printWin.document.write('<div class="preview">' + finalHtml + '</div>');
  printWin.document.write('</body></html>');
  printWin.document.close();
  printWin.focus();

  // Wait a beat for SVG layout before print dialog
  setTimeout(() => { printWin.print(); }, 800);
}

// Speech-to-text for recordings
let recognition = null;
let transcriptText = '';
let recordingTranscripts = {};
let recIdCounter = 0;

function startTranscription(recId) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return;
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  transcriptText = '';
  recognition.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        transcriptText += e.results[i][0].transcript + ' ';
      } else {
        interim += e.results[i][0].transcript;
      }
    }
  };
  recognition.onerror = () => {};
  recognition.start();
}

function stopTranscription(recId) {
  if (recognition) {
    try { recognition.stop(); } catch(e) {}
    recognition = null;
  }
  if (transcriptText.trim()) {
    recordingTranscripts[recId] = transcriptText.trim();
  }
}

// --- SEEDED DEMO NOTE ---
(function() {
  const demoTitle = 'How DNS Resolves a Domain Name';
  if (!notes.some(n => n.title === demoTitle)) {
    const demoNote = {
      id: genId(),
      title: demoTitle,
      content: `# How DNS Resolves a Domain Name

**Ever wonder what happens when you type "google.com" and press Enter?**

## The Real-World Analogy

You want to call your friend Alex, but you only know their name, not their phone number. You look up Alex in a phone book. The phone book gives you the number, and now you can dial it.

**DNS (Domain Name System) is the internet's phone book.** Browsers speak in IP addresses (like \`142.250.190.78\`), but humans speak in domain names (like \`google.com\`). DNS translates between them.

## The Lookup Flow

\`\`\`mermaid
sequenceDiagram
    participant You as Your Browser
    participant Cache as Local Cache
    participant Resolver as DNS Resolver (ISP)
    participant Root as Root Server
    participant TLD as .com TLD Server
    participant Auth as Google's Authoritative DNS
    You->>Cache: Do I know google.com?
    alt Cache HIT
        Cache-->>You: Yes! IP is 142.250.190.78
    else Cache MISS
        Cache-->>You: Nope, go ask the resolver
        You->>Resolver: What's the IP for google.com?
        Resolver->>Root: Where's the .com nameserver?
        Root-->>Resolver: Ask the .com TLD at a.gtld-servers.net
        Resolver->>TLD: Where's google.com's nameserver?
        TLD-->>Resolver: Ask ns1.google.com
        Resolver->>Auth: What's the IP for google.com?
        Auth-->>Resolver: It's 142.250.190.78
        Resolver-->>You: Here's the IP!
        You-->>Cache: Storing for next time
    end
\`\`\`

## Step by Step

1. **Browser cache check** â€” your browser first checks if it already knows the IP (from a recent lookup)
2. **OS cache check** â€” if the browser doesn't know, it asks the operating system, which may have it cached
3. **Recursive resolver** â€” the OS sends the query to your ISP's DNS resolver (or Cloudflare's \`1.1.1.1\` / Google's \`8.8.8.8\`)
4. **Root server** â€” the resolver asks a root server "who manages .com?" The root doesn't know \`google.com\`, but it knows where the \`.com\` nameserver lives
5. **TLD server** â€” the resolver asks the \`.com\` TLD server "who manages \`google.com\`?" It replies with Google's authoritative nameserver
6. **Authoritative server** â€” the resolver asks \`ns1.google.com\` "what's the IP?" This server knows the exact answer
7. **Response** â€” the IP flows back: auth â†’ resolver â†’ OS â†’ browser, which then opens the connection

## Why It Matters

Every website visit triggers this chain. Without DNS, you'd have to memorize IP addresses for every site you visit. A failure at any step means the site won't load. This is why:
- Cache expiry (\`TTL\`) balances freshness vs. speed
- DNS attacks (cache poisoning, DDoS on root servers) can take down large parts of the internet
- CDNs use DNS to route you to the nearest server (geo-based answers)

## Common Misconception

**"DNS just looks up IP addresses."** It also handles mail routing (MX records), security (DNSSEC), spam prevention (SPF/DKIM), and can redirect traffic (CNAME records). It's far more than just a phone book.

## One-Line Summary

DNS translates human-readable domain names into machine-routable IP addresses through a hierarchical chain of caches and authoritative servers.`,
      updated: Date.now()
    };
    notes.unshift(demoNote);
    currentId = demoNote.id;
    saveAll();
  }
